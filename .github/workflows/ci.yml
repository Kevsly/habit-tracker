name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,all]"
      - name: Install Tkinter and Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Check the CLI runs
        run: ht env
      - name: Check the GUI imports
        run: python -c "import habit_tracker.gui; print('gui ok')"
      # The GUI tests skip themselves when no display is present, which would
      # quietly turn Linux CI into a headless run. xvfb gives them a real one,
      # and any skip is then treated as a failure so a broken setup is visible.
      - name: Run tests (Linux, with a virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -m pytest -q -rs | tee pytest.log
          if grep -qE "^[0-9]+ skipped|skipped" pytest.log; then
            echo "::error::tests were skipped on Linux - the virtual display is not working"
            grep -n "skipped" pytest.log
            exit 1
          fi
      - name: Run tests (Windows)
        if: runner.os != 'Linux'
        run: python -m pytest -q

  package:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop:
    name: Build the frozen desktop app
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[all,build]"
      - name: Install Tkinter (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      # A bad entry script only shows up at runtime: PyInstaller happily
      # builds a binary that dies on its first relative import.
      - name: Build
        run: python -m PyInstaller --noconfirm --clean habit_tracker.spec
      - name: Check the binary was produced
        shell: bash
        run: |
          ls -la dist/
          if [ -n "$(find dist -maxdepth 1 -type f -name 'HabitTracker*' -print -quit)" ]; then
            echo "frozen app built"
          elif [ -d dist/HabitTracker ]; then
            echo "frozen app built (directory)"
          else
            echo "::error::no frozen app in dist/"
            exit 1
          fi
